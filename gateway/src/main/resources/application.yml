spring:
  application:
    name: gateway
  datasource:
    url: jdbc:sqlite:${OMNIREAD_GATEWAY_DB:./var/gateway.db}
    driver-class-name: org.sqlite.JDBC

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  address: 127.0.0.1
  port: 8080
