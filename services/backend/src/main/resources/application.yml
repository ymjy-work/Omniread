server:
  port: 8080

spring:
  application:
    name: omniread-backend

mybatis:
  # classpath*: 而不是 classpath:——测试资源里也有 mapper，只取第一个匹配会漏掉一侧。
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 列名 snake_case → 属性 camelCase 统一在这里处理，语句里就不必逐列写 AS 别名。
    map-underscore-to-camel-case: true

omniread:
  context:
    # 多轮上下文预算（多轮会话落地方案 §三）。三个数不是三件独立的事：
    # history-budget-tokens 同时是「近轮原文的预算」与「摘要的触发线」——攒下的对话
    # 超过了模型能看到的量，就有一段谁也看不见；keep-recent 决定那一段从哪里切开。
    #
    # **keep-recent 要明显小于窗口装得下的轮数**（keep × 每轮 token ≲ 窗口）：取大了会出现
    # 「既不在摘要里、也不在窗口里」的一段，取小了只是多压一点还看得到的原文（无害但白跑）。
    # 默认按真实回答每轮几百到一千五百 token 估：12000 的窗口 ≈ 十来轮，keep 取 8 留了余量。
    history-budget-tokens: ${OMNIREAD_HISTORY_BUDGET:12000}
    min-recent-turns: ${OMNIREAD_MIN_RECENT_TURNS:2}
    keep-recent-on-summarize: ${OMNIREAD_KEEP_RECENT_ON_SUMMARIZE:8}
  store:
    # 账户 / 会话 / 进度 / 配额都落这一个 SQLite 文件（多轮会话落地方案 §一）。
    # 连接参数（WAL / busy_timeout / foreign_keys）由 StoreConfig 拼进 URL，不在这里。
    file: ${OMNIREAD_DB_FILE:var/omniread.db}
  auth:
    # 登录 cookie 的 Secure 属性（docs/m1/用户管理需求.md §三）。默认开，缺省即安全：
    # 只有在本机用 http 调试、且浏览器不把 localhost 当可信来源时才关，
    # 而关掉之后 cookie 走明文，**不能进部署环境**。cookie 名不在这里——它由契约钉死。
    cookie-secure: ${OMNIREAD_AUTH_COOKIE_SECURE:true}
    # 登录态有效期；方案定的是 8 小时，到点重新登录（不做滑动续期）。
    session-ttl: ${OMNIREAD_AUTH_TTL:8h}
  rag:
    # Python RAG 服务地址。Java 是唯一调用方，前端不直连（M0-00 §4）。
    base-url: ${OMNIREAD_RAG_BASE_URL:http://127.0.0.1:8000}
    # 连不上要快速失败：请求已经进来，拖住客户端没有意义。
    connect-timeout: 2s
    # 读超时要覆盖一次完整生成（含 provider 往返），按最慢的情况留。
    read-timeout: 120s
    retry:
      # max-attempts 是总次数，2 表示重试一次。只重试传输失败。
      max-attempts: 2
      wait-duration: 300ms
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 5
      wait-duration-in-open-state: 10s
  web:
    # 前端构建产物目录（web/ 由前端产出）。相对路径从进程工作目录向上最多找 4 层，
    # 从仓库根或从 services/backend 启动都能命中；目录不存在时只跳过静态资源托管。
    dist-dir: ${OMNIREAD_WEB_DIST:web/dist}

logging:
  level:
    com.omniread.backend: INFO
  pattern:
    # 每行日志带 request_id（MDC，由 RequestIdFilter 放入）；请求线程之外的行该值为空。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{request_id:-}] %logger{36} - %msg%n"
