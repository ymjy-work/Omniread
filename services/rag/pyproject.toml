[project]
name = "omniread"
version = "0.1.0"
description = "Omniread RAG 服务：导入、分块、检索、装配、回答、插图读取"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.0",
    "minio==7.2.20",
    "tiktoken==0.14.0",
    "bm25s==0.3.11",
    "jieba==0.42.1",
    "qwen-tokenizer==0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniread"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pyyaml==6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# 中文注释与文档字符串按中文标点书写，全角标点不算问题。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["omniread"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` 写在参数默认值里是 FastAPI 的依赖注入写法，不是可变默认值问题。
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["jieba", "bm25s", "minio.*", "yaml", "qwen_tokenizer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
