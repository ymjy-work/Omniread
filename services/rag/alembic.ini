# Alembic config. Migration scripts live in services/rag/migrations.
# Keep this file ASCII-only: configparser reads it with the OS locale encoding,
# and non-ASCII bytes fail to decode under a GBK Windows locale.
# The connection URL is assembled from env vars by migrations/env.py; no
# credential is written to any file (M0-00 section 6).
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
