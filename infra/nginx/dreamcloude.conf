# dreamcloude.com 反向代理 —— **Cloudflare 代理模式（橙云）**
#
# 部署（在主机上）：
#   cp 到 /etc/nginx/sites-available/dreamcloude
#   ln -sf /etc/nginx/sites-available/dreamcloude /etc/nginx/sites-enabled/dreamcloude
#   rm -f /etc/nginx/sites-enabled/default     # 它声明了同样的 server_name，留着会撞
#   nginx -t && systemctl reload nginx
#
# 目标 nginx 是 Ubuntu 24.04 自带的 1.24.0。**1.24 没有 `http2 on;` 这个写法**
# （1.25.1 才引入），所以用 `listen 443 ssl http2;`。升级 nginx 后再改新写法。
#
# 依赖的前提（不成立会静默出问题）：
#   · Cloudflare 的 SSL/TLS 模式必须是 **Full (strict)**。选 Flexible 时 CF→源站走 80，
#     会命中下面 80 端的 301，形成无限重定向，整站打不开。
#   · 图片端点必须带 `Cache-Control: private, no-store`（见 CatalogController.getImage）：
#     插图 URL 带扩展名，CF 默认按扩展名缓存、不看路径。

# ---- 真实客户端 IP ----
# 开了橙云之后，与 nginx 建连的是 Cloudflare 边缘，$remote_addr 会是**边缘 IP**；
# 真实客户端地址只在 CF-Connecting-IP 里。下面把可信来源限定成 Cloudflare 自己的网段：
# 只有来自这些网段的连接才触发改写，其余请求的 $remote_addr 仍是它自己的地址，
# 所以「伪造 CF-Connecting-IP」在直连源站时不成立。
#
# 网段来源：https://www.cloudflare.com/ips-v4 与 https://www.cloudflare.com/ips-v6
# **这两个列表会变**；变了要同步改这里（以及源站防火墙的放行范围）。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name dreamcloude.com www.dreamcloude.com;

    # certbot 的 HTTP-01 挑战必须能从 80 明文取到。放在 301 之前、用 ^~ 抢在正则之前，
    # 否则挑战请求会被 301 到 https，再落到下面的反代上变成 404，续期静默失败。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dreamcloude.com www.dreamcloude.com;

    ssl_certificate     /etc/letsencrypt/live/dreamcloude.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dreamcloude.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS **不在这里发**：Cloudflare 面板自己有一个 HSTS 开关，两处都开会在响应里
    # 出现两条 Strict-Transport-Security。在 CF 面板开。
    # X-Robots-Tag 同理：应用侧 NoIndexHeaderFilter 已经带，这里不重复。

    client_max_body_size 1m;

    # SSE：不关缓冲的话，「逐字上屏」会变成整段一次性出现。
    # 注意 Cloudflare 非企业版对源站响应有约 100 秒上限，比这里的 300s 更早生效。
    location = /api/v1/query-stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 覆盖式，不用 $proxy_add_x_forwarded_for：上面 real_ip 已经把 $remote_addr 换成了
        # 真实客户端 IP，覆盖后 Spring 取到的就是它。
        # **不要**在这里补 `allow <CF 网段>; deny all;`：real_ip 改写的是 $remote_addr，
        # access 模块比对的也是改写后的值，拿 CF 网段去比会把所有客户端一起拒掉。
        # 源站收口请在 Lightsail 防火墙做（80/443 只放行 CF 网段）。
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Spring 解析真实 IP 时**先读 Forwarded 头**，只改 XFF 仍可被它绕过。
        proxy_set_header Forwarded         "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Forwarded         "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }
}
